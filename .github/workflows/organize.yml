name: Organize LeetCode Solutions

on:
  # Right after LeetHub commits a new solution.
  push:
    branches: [main]
    paths-ignore:
      - 'topics/**'
      - 'README.md'
      - '.leetcode_meta_cache.json'
  # Safety net, in case a push slipped through while a run was in flight.
  schedule:
    - cron: '0 3 * * *'   # 03:00 UTC daily
  workflow_dispatch: {}

permissions:
  contents: write

# If LeetHub pushes multiple commits in rapid succession, cancel earlier
# in-flight runs so only the final settled commit is organized.
concurrency:
  group: organize-solutions
  cancel-in-progress: true

jobs:
  organize:
    runs-on: ubuntu-latest
    steps:
      - name: Settle delay for LeetHub multi-commit sync
        run: sleep 10

      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run organizer
        run: python scripts/organize.py
        env:
          REPO_ROOT: ${{ github.workspace }}

      - name: Commit and push if anything changed
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "Nothing to organize — repo is already up to date."
            exit 0
          fi

          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: file new solutions and refresh progress tables"

          # Push with retry in case remote updated
          for attempt in 1 2 3 4 5; do
            if git pull --rebase --autostash origin main && git push origin HEAD:main; then
              echo "Pushed on attempt $attempt."
              exit 0
            fi
            echo "Push attempt $attempt failed, aborting dirty rebase and retrying..."
            git rebase --abort 2>/dev/null || true
            sleep 5
          done

          echo "Could not push after 5 attempts."
          exit 1
